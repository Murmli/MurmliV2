targets:
  $default:
    builders:
      slang_build_runner:
        options:
          base_locale: de
          fallback_strategy: base_locale
          input_directory: lib/i18n
          output_directory: lib/i18n
      drift_dev:
        options:
          databases:
            app_database: lib/app/core/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
