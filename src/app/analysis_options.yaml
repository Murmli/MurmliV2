include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.gr.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - discarded_futures
    - unawaited_futures
