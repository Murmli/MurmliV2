name: app
description: "Murmli mobile app."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  # Flutter
  flutter:
    sdk: flutter
  material_ui: ^1.11.0

  # Routing
  auto_route: ^11.2.0

  # State-Management
  hooks_riverpod: ^3.5.0
  flutter_hooks: ^0.21.4
  riverpod_annotation: ^4.0.8

  # Localization
  slang: ^4.19.2
  slang_flutter: ^4.19.0

  # Model
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Logging
  talker: ^5.2.0
  talker_flutter: ^5.2.0
  talker_dio_logger: ^5.2.0
  talker_riverpod_logger: ^5.2.0

  # API
  dio: ^5.11.1
  retrofit: ^4.10.0

  # DB
  drift: ^2.35.4
  drift_flutter: ^0.3.1

  # Storage
  shared_preferences: ^2.5.6

  # Utilities
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  crypto: ^3.0.8

  # Authentication
  sign_in_with_apple: ^8.2.0
  google_sign_in_android: ^7.2.19
  google_sign_in_platform_interface: ^3.1.0

  # Crash Reporting
  sentry_flutter: ^10.5.0
  clock: ^1.1.3

dev_dependencies:
  # Flutter
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter

  # Testing
  shared_preferences_platform_interface: ^2.4.2
  path_provider_platform_interface: ^2.1.3
  sign_in_with_apple_platform_interface: ^2.0.0

  # Lints
  flutter_lints: ^6.0.0

  # Routing
  auto_route_generator: ^10.6.0

  # State-Management
  riverpod_generator: ^4.0.10

  # Localization
  slang_build_runner: ^4.19.0

  # Model
  freezed: ^4.0.1
  json_serializable: ^6.15.2

  # API
  retrofit_generator: ^10.3.3

  # DB
  drift_dev: ^2.35.3

  # Crash Reporting
  sentry_dart_plugin: ^3.5.0
  flutter_adaptive_studio: 0.28.15

flutter:
  default-flavor: development
  uses-material-design: true

  assets:
    - assets/fonts/BricolageGrotesque-OFL.txt
    - assets/fonts/GoogleSans-OFL.txt
    - assets/fonts/PlusJakartaSans-OFL.txt
    - assets/images/google_logo.png

  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf

sentry:
  org: murmli
  project: app
  name: de.murmli.app
  symbols_path: build/debug-info
  commits: false
