name: Set up auth service
description: Installs the Node.js version pinned in src/auth/.nvmrc and the locked dependencies.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: src/auth/.nvmrc
        cache: npm
        cache-dependency-path: src/auth/package-lock.json

    - run: npm ci
      shell: bash
      working-directory: src/auth
