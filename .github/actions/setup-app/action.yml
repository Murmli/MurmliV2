name: Set up app
description: Installs the Flutter version pinned in src/app/.fvmrc, resolves the locked dependencies and runs code generation.

runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        flutter-version-file: src/app/.fvmrc
        cache: true

    - run: flutter pub get --enforce-lockfile
      shell: bash
      working-directory: src/app

    - run: dart run build_runner build
      shell: bash
      working-directory: src/app
