name: Build app

on:
  workflow_call:
    inputs:
      flavor:
        description: App flavor to build (local, development or production).
        type: string
        required: true
      deliver:
        description: Upload debug symbols and R8 mappings to Sentry with the secret SENTRY_AUTH_TOKEN of the environment development, keep the iOS app as artifact ios-ipa for deliver-app.yml, and keep the Android app bundle as artifact android-aab.
        type: boolean
        required: true
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false
      APPLE_CERTIFICATE_DATA:
        required: false
      APPLE_CERTIFICATE_PASSPHRASE:
        required: false
      APPLE_APP_STORE_CONNECT_KEY:
        required: false
      APPLE_APP_STORE_CONNECT_KEY_ID:
        required: false
      APPLE_APP_STORE_CONNECT_ISSUER_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      ANDROID_UPLOAD_KEYSTORE:
        required: false
      ANDROID_UPLOAD_KEYSTORE_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    # Environment secrets only reach jobs that name the environment.
    environment:
      name: ${{ inputs.deliver && 'development' || '' }}
      deployment: false
    defaults:
      run:
        working-directory: src/app
    steps:
      - uses: actions/checkout@v7
      - name: Check Sentry auth token
        if: inputs.deliver
        # An unset secret arrives as an empty string, which sentry_dart_plugin accepts until the upload fails.
        run: ': "${SENTRY_AUTH_TOKEN:?SENTRY_AUTH_TOKEN is missing in the development environment}"'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Check Android signing secrets
        # Repository secrets, so pull requests sign too; pull requests from forks get none and stop here.
        run: |
          : "${ANDROID_UPLOAD_KEYSTORE:?ANDROID_UPLOAD_KEYSTORE is missing in the repository secrets}"
          : "${ANDROID_UPLOAD_KEYSTORE_PASSWORD:?ANDROID_UPLOAD_KEYSTORE_PASSWORD is missing in the repository secrets}"
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: ./.github/actions/setup-app
      - name: Write upload keystore
        run: printf '%s' "$ANDROID_UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.keystore"
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
      - name: Build app bundle
        run: flutter build appbundle --release --flavor "$FLAVOR" --split-debug-info=build/debug-info --build-number="$BUILD_NUMBER"
        env:
          FLAVOR: ${{ inputs.flavor }}
          BUILD_NUMBER: ${{ github.run_number }}
          ORG_GRADLE_PROJECT_murmliUploadKeystoreFile: ${{ runner.temp }}/upload.keystore
          ORG_GRADLE_PROJECT_murmliUploadKeystorePassword: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_sentryUploadProguardMapping: ${{ inputs.deliver }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Check app bundle
        id: bundle
        # Without the upload key properties Gradle signs with the debug key, which Google Play rejects.
        run: |
          bundle=$(ls build/app/outputs/bundle/"$FLAVOR"Release/*.aab)
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum --check --quiet
          upload_key=$(keytool -list -v -keystore "$RUNNER_TEMP/upload.keystore" -storepass:env ANDROID_UPLOAD_KEYSTORE_PASSWORD -alias upload | grep 'SHA256:')
          signer=$(keytool -printcert -jarfile "$bundle" | grep 'SHA256:' || true)
          if [ "$signer" != "$upload_key" ]; then
            echo "::error::$bundle is not signed with the upload key"
            exit 1
          fi
          manifest_value() {
            java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$bundle" --xpath="$1"
          }
          application_id=$(manifest_value /manifest/@package)
          version_name=$(manifest_value /manifest/@android:versionName)
          version_code=$(manifest_value /manifest/@android:versionCode)
          echo "Application ID $application_id, version name $version_name, version code $version_code"
          {
            echo "application-id=$application_id"
            echo "version-name=$version_name"
            echo "version-code=$version_code"
          } >> "$GITHUB_OUTPUT"
        env:
          FLAVOR: ${{ inputs.flavor }}
          BUNDLETOOL_VERSION: 1.18.3
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      - name: Upload debug symbols
        if: inputs.deliver
        # The sentry section of the pubspec names the production application id and the pubspec build number, the app reports the ones it was built with.
        run: dart run sentry_dart_plugin
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ steps.bundle.outputs.application-id }}@${{ steps.bundle.outputs.version-name }}+${{ steps.bundle.outputs.version-code }}
          SENTRY_DIST: ${{ steps.bundle.outputs.version-code }}
      - name: Keep app bundle for delivery
        if: inputs.deliver
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: src/app/build/app/outputs/bundle/${{ inputs.flavor }}Release/*.aab
          if-no-files-found: error
          retention-days: 1
      - name: Remove signing secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

  ios:
    name: iOS
    runs-on: macos-latest
    # Environment secrets only reach jobs that name the environment.
    environment:
      name: ${{ inputs.deliver && 'development' || '' }}
      deployment: false
    defaults:
      run:
        working-directory: src/app
    steps:
      - uses: actions/checkout@v7
      - name: Check Sentry auth token
        if: inputs.deliver
        # An unset secret arrives as an empty string, which sentry_dart_plugin accepts until the upload fails.
        run: ': "${SENTRY_AUTH_TOKEN:?SENTRY_AUTH_TOKEN is missing in the development environment}"'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Check Apple secrets
        # Repository secrets, so pull requests sign too; pull requests from forks get none and stop here.
        run: |
          : "${APPLE_CERTIFICATE_DATA:?APPLE_CERTIFICATE_DATA is missing in the repository secrets}"
          : "${APPLE_CERTIFICATE_PASSPHRASE:?APPLE_CERTIFICATE_PASSPHRASE is missing in the repository secrets}"
          : "${APPLE_APP_STORE_CONNECT_KEY:?APPLE_APP_STORE_CONNECT_KEY is missing in the repository secrets}"
          : "${APPLE_APP_STORE_CONNECT_KEY_ID:?APPLE_APP_STORE_CONNECT_KEY_ID is missing in the repository secrets}"
          : "${APPLE_APP_STORE_CONNECT_ISSUER_ID:?APPLE_APP_STORE_CONNECT_ISSUER_ID is missing in the repository secrets}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is missing in the repository secrets}"
        env:
          APPLE_CERTIFICATE_DATA: ${{ secrets.APPLE_CERTIFICATE_DATA }}
          APPLE_CERTIFICATE_PASSPHRASE: ${{ secrets.APPLE_CERTIFICATE_PASSPHRASE }}
          APPLE_APP_STORE_CONNECT_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY }}
          APPLE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ID }}
          APPLE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: ./.github/actions/setup-app
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: src/app
      - name: Write signing inputs
        run: |
          printf '%s' "$APPLE_CERTIFICATE_DATA" | base64 -d > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$APPLE_APP_STORE_CONNECT_KEY" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
        env:
          APPLE_CERTIFICATE_DATA: ${{ secrets.APPLE_CERTIFICATE_DATA }}
          APPLE_APP_STORE_CONNECT_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY }}
      - run: bundle exec fastlane ios prepare_signing flavor:"$FLAVOR"
        env:
          FLAVOR: ${{ inputs.flavor }}
          APPLE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ID }}
          APPLE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_PASSPHRASE: ${{ secrets.APPLE_CERTIFICATE_PASSPHRASE }}
          FASTLANE_WWDR_USE_HTTP1_AND_RETRIES: '1'
      - name: Build IPA
        # flutter build ipa exits 0 when only the export of the archive fails.
        run: |
          flutter build ipa --release --flavor "$FLAVOR" --split-debug-info=build/debug-info --build-number="$BUILD_NUMBER"
          ls build/ios/ipa/*.ipa
        env:
          FLAVOR: ${{ inputs.flavor }}
          BUILD_NUMBER: ${{ github.run_number }}
      - name: Upload debug symbols
        if: inputs.deliver
        # The sentry section of the pubspec names the production bundle id and the pubspec build number, the app reports the ones it was built with.
        run: |
          info_plist=build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Info.plist
          bundle_identifier=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info_plist")
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_plist")
          build_number=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_plist")
          SENTRY_RELEASE="$bundle_identifier@$version+$build_number" SENTRY_DIST="$build_number" dart run sentry_dart_plugin
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Keep IPA for delivery
        if: inputs.deliver
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: src/app/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 1
      - name: Remove signing secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/AuthKey.p8"
          keychain="$HOME/Library/Keychains/fastlane_tmp_keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
          fi
